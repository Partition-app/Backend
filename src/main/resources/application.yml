spring:
  datasource:
    url: jdbc:mysql://localhost:3306/partition_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  api-docs:
    path: /v3/api-docs
    enabled: true

jwt:
  secret: ${JWT_SECRET}
  access-token-validity: 86400000 # 1?
  refresh-token-validity: 604800000 # 7?