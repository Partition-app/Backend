version: "3.8"

services:
  app:
    image: danaggero/partition-spring:latest
    container_name: partition-spring
    env_file:
      - .env
    ports:
      - "8080:8080"
    volumes:
      - /home/ubuntu/partition/firebase-adminsdk.json:/app/firebase-adminsdk.json:ro
    restart: always

  nginx:
    image: nginx:latest
    container_name: partition-nginx
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: always