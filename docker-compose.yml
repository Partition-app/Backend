version: "3.8"

services:
  app:
    image: danaggero/partition-spring:latest
    container_name: partition-spring
    env_file:
      - .env
    ports:
      - "8080:8080"
    volumes:
      - /home/ubuntu/partition/firebase-adminsdk.json:/app/firebase-adminsdk.json:ro
    restart: always

  nginx:
    image: nginx:latest
    container_name: partition-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - app
    restart: always

  certbot:
    image: certbot/certbot
    container_name: partition-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    restart: always

  prometheus:
    image: prom/prometheus:latest
    container_name: partition-prometheus
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: partition-grafana
    environment:
      - GF_SERVER_ROOT_URL=https://api.partition.site/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: always

volumes:
  prometheus-data:
  grafana-data: